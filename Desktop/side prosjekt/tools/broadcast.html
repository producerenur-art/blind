<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ — send live · Traktor broadcast</title>
<style>
  :root { --bg:#0b0d12; --card:#141821; --line:rgba(255,255,255,.1); --text:#e8eaf0; --text2:#9aa3b2; --accent:#f59e0b; --green:#22c55e; --red:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text); padding:1.5rem; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:1.35rem; margin:0 0 .25rem; }
  .sub { color:var(--text2); margin:0 0 1.25rem; font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.1rem 1.25rem; margin-bottom:1rem; }
  label { display:block; font-weight:700; font-size:.8rem; margin:0 0 .35rem; color:var(--text2); text-transform:uppercase; letter-spacing:.04em; }
  select { width:100%; padding:.6rem .7rem; border-radius:10px; border:1px solid var(--line); background:#0e1219; color:var(--text); font:inherit; }
  .btn { padding:.65rem 1.1rem; border-radius:10px; border:1px solid var(--line); background:#1c2230; color:var(--text); font:inherit; font-weight:700; cursor:pointer; }
  .btn:hover { border-color:rgba(255,255,255,.25); }
  .btn.primary { background:var(--accent); color:#1a1205; border-color:transparent; }
  .btn.danger  { background:var(--red); color:#fff; border-color:transparent; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
  .pill { display:inline-flex; align-items:center; gap:.4rem; font-size:.78rem; font-weight:700; padding:.25rem .7rem; border-radius:999px; background:rgba(255,255,255,.06); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--text2); }
  .dot.live { background:var(--red); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .meter { height:20px; border-radius:6px; background:#080a0e; overflow:hidden; position:relative; }
  .meter > i { position:absolute; inset:0 auto 0 0; width:0%; background:linear-gradient(90deg,var(--green),var(--green) 60%,var(--accent) 80%,var(--red)); transition:width .05s; }
  .meter-label { display:flex; justify-content:space-between; font-size:.72rem; color:var(--text2); margin:.5rem 0 .2rem; }
  .big { font-size:2rem; font-weight:800; }
  .log { font:12px/1.5 ui-monospace,monospace; background:#080a0e; border-radius:10px; padding:.7rem .8rem; max-height:150px; overflow:auto; color:var(--text2); white-space:pre-wrap; }
  code { background:#0e1219; padding:.1rem .4rem; border-radius:5px; }
  a { color:#38bdf8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎧 DJ — send live</h1>
  <p class="sub">Fanger Traktors lyd og sender den i sanntid (WebRTC) til alle som åpner lytter-lenken. Rut Traktors master til lydkortet/BlackHole og velg det under.</p>

  <div class="card">
    <label for="dev">Lyd-inngang (Traktors rute)</label>
    <div class="row" style="margin-bottom:.8rem">
      <select id="dev" style="flex:1;min-width:200px"><option>Trykk «Gi tilgang» først…</option></select>
      <button class="btn" id="perm">Gi tilgang</button>
    </div>
    <div class="row">
      <button class="btn primary" id="go" disabled>📡 Gå live</button>
      <button class="btn danger"  id="stop" disabled>■ Stopp sending</button>
      <span class="pill"><span class="dot" id="dot"></span><span id="status">Inaktiv</span></span>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><span class="big" id="count">0</span> <span style="color:var(--text2)">lyttere koblet til</span></div>
      <div style="text-align:right;font-size:.82rem;color:var(--text2)">Lytter-lenke (samme WiFi):<br><code id="link">…</code></div>
    </div>
    <div class="meter-label" style="margin-top:1rem"><span>Sendt signal (L)</span><span id="ldb">−∞ dB</span></div>
    <div class="meter"><i id="lmeter"></i></div>
    <div class="meter-label" style="margin-top:.6rem"><span>Sendt signal (R)</span><span id="rdb">−∞ dB</span></div>
    <div class="meter"><i id="rmeter"></i></div>
  </div>

  <div class="card"><label>Logg</label><div class="log" id="log">Klar.</div></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const log = m => { const l=$('log'); l.textContent += '\n'+new Date().toLocaleTimeString('nb-NO')+'  '+m; l.scrollTop=l.scrollHeight; };
  const ICE = { iceServers:[{ urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302'] }] };
  const ROOM = 'live';
  const myId = 'dj_' + Math.random().toString(36).slice(2,8);
  let stream, ctx, analL, analR, raf, es;
  const peers = new Map(); // listenerId -> RTCPeerConnection

  // Lytter-lenken peker på den host nettleseren lastet siden fra (LAN-IP funker på mobil).
  $('link').textContent = location.origin.replace(/\/$/,'') + '/listen';

  $('perm').onclick = async () => {
    try {
      const tmp = await navigator.mediaDevices.getUserMedia({ audio:true });
      tmp.getTracks().forEach(t=>t.stop());
      const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
      const sel=$('dev'); sel.innerHTML='';
      devs.forEach(d=>{ const o=document.createElement('option'); o.value=d.deviceId; o.textContent=d.label||('Inngang '+(sel.length+1)); sel.appendChild(o); });
      const pref = devs.find(d=>/blackhole|loopback|soundflower|air 192|aggregate/i.test(d.label));
      if (pref) sel.value = pref.deviceId;
      $('go').disabled=false;
      log(devs.length+' inngang(er) funnet.'+(pref?'  Foreslår: '+pref.label:''));
    } catch(e){ log('FEIL tilgang: '+e.message); }
  };

  async function signal(to, data){
    try { await fetch('/signal',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ room:ROOM, to, from:myId, data }) }); }
    catch(e){ log('signal-feil: '+e.message); }
  }

  async function addListener(listenerId){
    if (peers.has(listenerId)) return;
    const pc = new RTCPeerConnection(ICE);
    peers.set(listenerId, pc);
    stream.getAudioTracks().forEach(t => pc.addTrack(t, stream));
    pc.onicecandidate = e => { if (e.candidate) signal(listenerId, { type:'ice', candidate:e.candidate }); };
    pc.onconnectionstatechange = () => {
      log('Lytter '+listenerId+': '+pc.connectionState);
      if (['failed','disconnected','closed'].includes(pc.connectionState)) { pc.close(); peers.delete(listenerId); updateCount(); }
      updateCount();
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await signal(listenerId, { type:'offer', sdp:pc.localDescription });
    log('Sendte tilbud til lytter '+listenerId);
    updateCount();
  }

  function updateCount(){ const n=[...peers.values()].filter(pc=>pc.connectionState==='connected').length; $('count').textContent=n; }

  $('go').onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio:{
        deviceId:{ exact:$('dev').value },
        echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:2,
      }});
      // Nivåmåler på det vi sender
      ctx = new (window.AudioContext||window.webkitAudioContext)(); await ctx.resume();
      const src=ctx.createMediaStreamSource(stream), sp=ctx.createChannelSplitter(2);
      analL=ctx.createAnalyser(); analR=ctx.createAnalyser(); analL.fftSize=analR.fftSize=1024;
      src.connect(sp); sp.connect(analL,0); sp.connect(analR,1); drawMeter();

      // Koble til signaling
      es = new EventSource(`/events?room=${ROOM}&peerId=${myId}&role=dj`);
      es.onmessage = async ev => {
        const msg = JSON.parse(ev.data);
        if (msg.type==='listener-join') { log('Ny lytter: '+msg.from); addListener(msg.from); }
        else if (msg.type==='peer-left') { const pc=peers.get(msg.from); if(pc){pc.close();peers.delete(msg.from);updateCount();} log('Lytter dro: '+msg.from); }
        else if (msg.type==='signal') {
          const pc = peers.get(msg.from); if(!pc) return;
          if (msg.data.type==='answer') await pc.setRemoteDescription(msg.data.sdp);
          else if (msg.data.type==='ice') { try{ await pc.addIceCandidate(msg.data.candidate); }catch(e){} }
        }
      };
      es.onerror = () => log('Signaling-tilkobling ustabil (prøver igjen automatisk)…');

      $('go').disabled=true; $('stop').disabled=false; $('perm').disabled=true; $('dev').disabled=true;
      $('dot').classList.add('live'); $('status').textContent='LIVE — sender';
      log('Du er LIVE. Del lytter-lenken. Spill i Traktor nå.');
    } catch(e){ log('FEIL gå live: '+e.message); }
  };

  $('stop').onclick = () => {
    cancelAnimationFrame(raf);
    peers.forEach(pc=>pc.close()); peers.clear(); updateCount();
    if (es) es.close();
    if (stream) stream.getTracks().forEach(t=>t.stop());
    if (ctx) ctx.close();
    $('go').disabled=false; $('stop').disabled=true; $('perm').disabled=false; $('dev').disabled=false;
    $('dot').classList.remove('live'); $('status').textContent='Stoppet';
    log('Sending stoppet.');
  };

  const toDb=r=>r>0?20*Math.log10(r):-Infinity, fmt=d=>d===-Infinity?'−∞ dB':d.toFixed(1)+' dB';
  function rms(a,b){ a.getFloatTimeDomainData(b); let s=0; for(let i=0;i<b.length;i++)s+=b[i]*b[i]; return Math.sqrt(s/b.length); }
  function drawMeter(){
    const bL=new Float32Array(analL.fftSize), bR=new Float32Array(analR.fftSize);
    const dL=toDb(rms(analL,bL)), dR=toDb(rms(analR,bR));
    const pct=d=>d===-Infinity?0:Math.max(0,Math.min(100,(d+60)/60*100));
    $('lmeter').style.width=pct(dL)+'%'; $('rmeter').style.width=pct(dR)+'%';
    $('ldb').textContent=fmt(dL); $('rdb').textContent=fmt(dR);
    raf=requestAnimationFrame(drawMeter);
  }

  if(!navigator.mediaDevices){ log('Nettleseren støtter ikke getUserMedia. Bruk Chrome/Safari over localhost/https.'); $('perm').disabled=true; }
})();
</script>
</body>
</html>
