<svg width="260" height="64" viewBox="0 0 260 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SiriusFM">
  <defs>
    <radialGradient id="scCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#bfeaff"/>
      <stop offset="72%" stop-color="#6fd3ff"/>
      <stop offset="100%" stop-color="#a98bff"/>
    </radialGradient>
    <radialGradient id="scGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6fd3ff" stop-opacity="0.5"/>
      <stop offset="45%"  stop-color="#a98bff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a98bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6fd3ff" stop-opacity="0.9"/>
      <stop offset="55%"  stop-color="#a98bff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6fd3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scWordA" x1="78" y1="20" x2="170" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#cfeaff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="scWordB" x1="170" y1="20" x2="244" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8fc9fd"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- ikon: Nova -->
  <g transform="translate(32 32) scale(0.6) translate(-50 -50)">
    <circle cx="50" cy="50" r="46" fill="url(#scGlow)"/>
    <ellipse cx="50" cy="50" rx="40" ry="14.5" stroke="url(#scRing)" stroke-width="2.2"
             transform="rotate(-24 50 50)" opacity="0.85"/>
    <path d="M50 18 Q52.4 47.6 82 50 Q52.4 52.4 50 82 Q47.6 52.4 18 50 Q47.6 47.6 50 18 Z"
          fill="#a98bff" opacity="0.5" transform="rotate(45 50 50)"/>
    <path d="M50 3 Q53 47 97 50 Q53 53 50 97 Q47 53 3 50 Q47 47 50 3 Z" fill="url(#scCore)"/>
    <circle cx="50" cy="50" r="7" fill="#ffffff" opacity="0.95"/>
    <circle cx="50" cy="50" r="11.5" fill="url(#scCore)" opacity="0.35"/>
  </g>

  <!-- ordmerke -->
  <text x="72" y="41" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="-0.5">
    <tspan fill="url(#scWordA)">Sirius</tspan><tspan fill="url(#scWordB)" font-weight="800">FM</tspan>
  </text>
</svg>
